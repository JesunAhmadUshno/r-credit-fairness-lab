name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Run tests
        run: Rscript tests/run_tests.R

      - name: Run the full pipeline end to end
        run: Rscript scripts/run_all.R

      - name: Check the split verification artifact
        run: |
          Rscript -e 'v <- jsonlite::read_json("results/split_verification.json"); stopifnot(isTRUE(v$identical))'

      - name: Toolkit reproduction check (study config asserts AUC 0.78237)
        run: |
          Rscript R/run_toolkit.R --data "data/default of credit card clients.xls" \
            --config scripts/toolkit_config_study.json --out-dir toolkit_out
          diff results/model_metrics.csv toolkit_out/model_metrics.csv
          diff results/fairness_audit.csv toolkit_out/fairness_audit.csv
          diff results/fairness_gaps.csv toolkit_out/fairness_gaps.csv
